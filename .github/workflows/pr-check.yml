name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    name: pr-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Audit bundle for third-party origins
        run: |
          grep -ohE 'https?://[a-zA-Z0-9._-]+' dist/assets/*.js | sort -u | tee /tmp/origins.txt
          if grep -qiE 'google-analytics|googletagmanager|sentry|mixpanel|posthog|segment|hotjar|cloudflareinsights|plausible|umami' /tmp/origins.txt; then
            echo "::error::tracking/analytics origin found in the bundle"; exit 1
          fi
          echo "bundle audit: no tracking origins"
